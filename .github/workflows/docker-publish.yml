name: publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is what lets the last step create the tag and the release.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the notes fallback can diff against the previous
          # release with `git log`.
          fetch-depth: 0

      # The release is driven by shared/version.ts, not by a pushed tag: a tag created
      # with GITHUB_TOKEN does NOT trigger workflows, so a separate tag-triggered build
      # would never run and the versioned image would silently never be published.
      - name: Read version
        id: v
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*VERSION = '\([0-9]*\.[0-9]*\.[0-9]*\)'.*/\1/p" shared/version.ts)
          if [ -z "$version" ]; then
            echo "::error file=shared/version.ts::could not parse VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "v$version already released — building :latest only" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new — will tag and release" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The exact-version tag applies only when that version has no git tag yet,
          # which keeps :2.2.1 immutable — pushing to main again without a bump must
          # not move it onto a different commit.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.fresh == 'true' }}
            type=raw,value=${{ steps.v.outputs.minor }},enable=${{ steps.v.outputs.fresh == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a version is never tagged when its image failed to build.
      - name: Tag and release
        if: github.ref == 'refs/heads/main' && steps.v.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          notes=$(mktemp)

          # Preferred: the hand-written CHANGELOG.md section for this version.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## +\\[?" v "\\]?" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > "$notes"
          fi

          if [ -s "$notes" ]; then
            source="CHANGELOG.md section"
          else
            # Deliberately NOT --generate-notes: it builds the body from merged pull
            # requests, and this repo commits straight to main, so it yields nothing
            # but a compare link. The commit log is at least readable.
            source="commit log"
            prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..HEAD" \
                | grep -v '^- chore: bump version' > "$notes" || true
            else
              git log --no-merges --pretty='- %s' \
                | grep -v '^- chore: bump version' > "$notes" || true
            fi
            [ -s "$notes" ] || echo "- No notable changes." > "$notes"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...v%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$VERSION" >> "$notes"
            fi
          fi

          echo "notes: $source" >> "$GITHUB_STEP_SUMMARY"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --latest --notes-file "$notes"
