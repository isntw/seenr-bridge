# Dev stack: single container, hot reload, source mounted.
#   UI + API: http://<host>:8687
services:
  seenr-bridge:
    # Same base as the Dockerfile so the compiled better-sqlite3 binding is
    # ABI-compatible either way.
    image: node:26-trixie-slim
    container_name: seenr-bridge-dev
    working_dir: /app
    environment:
      - DATA_DIR=/app/data
      - PORT=8687
    ports:
      - "8687:8687"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # python3/make/g++ are required: better-sqlite3 13.0.1 publishes no prebuild
    # for Node 26's ABI, so npm install compiles the native binding from source.
    # Without them the install fails with `gyp ERR! not ok`.
    command: bash -lc "apt-get update -qq && apt-get install -y -qq python3 make g++ >/dev/null 2>&1; npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
